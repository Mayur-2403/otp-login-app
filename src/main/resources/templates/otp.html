<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP — F1 Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #07090f;
    font-family: 'Barlow', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Background glow blobs */
  body::before {
    content: '';
    position: fixed; top: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(225,6,0,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed; bottom: -200px; left: -200px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(20,40,100,0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Animated speed lines background */
  .speedlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    overflow: hidden;
  }
  .speedlines span {
    position: absolute;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(225,6,0,0.25), transparent);
    animation: speedline 3s linear infinite;
    opacity: 0;
  }
  .speedlines span:nth-child(1)  { top: 12%; width: 35%; animation-delay: 0s;    animation-duration: 2.8s; }
  .speedlines span:nth-child(2)  { top: 24%; width: 20%; animation-delay: 0.6s;  animation-duration: 3.2s; }
  .speedlines span:nth-child(3)  { top: 38%; width: 45%; animation-delay: 1.1s;  animation-duration: 2.5s; }
  .speedlines span:nth-child(4)  { top: 52%; width: 28%; animation-delay: 0.3s;  animation-duration: 3.6s; }
  .speedlines span:nth-child(5)  { top: 65%; width: 38%; animation-delay: 1.7s;  animation-duration: 2.9s; }
  .speedlines span:nth-child(6)  { top: 78%; width: 22%; animation-delay: 0.9s;  animation-duration: 3.1s; }
  .speedlines span:nth-child(7)  { top: 88%; width: 50%; animation-delay: 2.1s;  animation-duration: 2.7s; }
  @keyframes speedline {
    0%   { transform: translateX(-100%); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateX(200vw); opacity: 0; }
  }

  /* Logo bar at top */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    height: 60px;
    display: flex; align-items: center; padding: 0 5vw;
    background: rgba(7,9,15,0.9);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(12px);
  }
  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 900; letter-spacing: 3px; color: #fff;
    text-decoration: none;
  }
  .logo span { color: #e10600; }

  /* Red accent line on left side */
  .side-stripe {
    position: fixed; left: 0; top: 0; bottom: 0;
    width: 5px; background: #e10600; z-index: 10;
  }

  /* Card */
  .card {
    position: relative; z-index: 5;
    width: 440px;
    background: rgba(10, 12, 22, 0.95);
    border: 1px solid rgba(255,255,255,0.07);
    border-top: 3px solid #e10600;
    border-radius: 4px 4px 12px 12px;
    padding: 48px 44px 44px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(225,6,0,0.08);
  }

  /* Step tag */
  .step-tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 4px;
    text-transform: uppercase; color: #e10600;
    margin-bottom: 10px;
  }

  /* Title */
  .card-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 40px; font-weight: 900; text-transform: uppercase;
    letter-spacing: 1px; line-height: .95;
    color: #fff; margin-bottom: 6px;
  }
  .card-title span { color: #e10600; }

  .card-sub {
    font-size: 13px; color: #666;
    margin-bottom: 32px; line-height: 1.6;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding-bottom: 28px;
  }

  /* OTP boxes */
  .otp-label {
    font-size: 11px; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; color: #555;
    margin-bottom: 12px; display: block;
  }

  .otp-input-wrap {
    position: relative; margin-bottom: 28px;
  }

  .otp-input {
    width: 100%;
    padding: 16px 20px 16px 52px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 700; letter-spacing: 8px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .otp-input::placeholder {
    color: #333; letter-spacing: 4px; font-size: 16px; font-weight: 400;
  }
  .otp-input:focus {
    border-color: #e10600;
    box-shadow: 0 0 0 3px rgba(225,6,0,0.12);
  }

  /* Lock icon inside input */
  .otp-icon {
    position: absolute; left: 18px; top: 50%;
    transform: translateY(-50%);
    font-size: 18px; opacity: 0.3;
  }

  /* Submit button */
  .submit-btn {
    width: 100%;
    padding: 16px;
    background: #e10600; color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 17px; font-weight: 800; letter-spacing: 3px;
    text-transform: uppercase;
    border: none; border-radius: 6px;
    cursor: pointer;
    transition: background .2s, transform .15s, box-shadow .2s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .submit-btn:hover {
    background: #ff2020;
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(225,6,0,0.45);
  }
  .submit-btn:active { transform: translateY(0); }

  /* Checkered flag icon on button */
  .btn-flag { font-size: 18px; }

  /* Footer note */
  .card-footer {
    margin-top: 22px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .card-footer-note {
    font-size: 11px; color: #444;
  }
  .resend-link {
    font-size: 12px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; color: #e10600;
    text-decoration: none; opacity: 0.7;
    transition: opacity .2s;
  }
  .resend-link:hover { opacity: 1; }

  /* Bottom branding */
  .bottom-brand {
    margin-top: 28px; z-index: 5;
    font-size: 11px; color: #2a2a2a; letter-spacing: 1px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="speedlines">
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span>
</div>

<div class="side-stripe"></div>

<div class="top-bar">
  <a href="/" class="logo">F1 <span>PORTAL</span></a>
</div>

<div class="card">
  <div class="step-tag">Step 2 of 2 — Authentication</div>
  <div class="card-title">Verify <span>OTP</span></div>
  <p class="card-sub">A one-time passcode was sent to your email.<br>Enter it below to gain pit lane access.</p>

  <form action="/verifyOtp" method="post">
    <label class="otp-label">One-Time Passcode</label>
    <div class="otp-input-wrap">
      <span class="otp-icon">🔒</span>
      <input
        class="otp-input"
        type="text"
        name="otp"
        placeholder="· · · · · ·"
        maxlength="8"
        autocomplete="one-time-code"
        required
      >
    </div>
    <button class="submit-btn" type="submit">
      <span class="btn-flag">🏁</span>
      Verify & Enter
    </button>
  </form>

  <div class="card-footer">
    <span class="card-footer-note">OTP expires in 10 minutes</span>
    <a href="/" class="resend-link">← Resend OTP</a>
  </div>
</div>

<div class="bottom-brand">Oracle Red Bull Racing · Powered by Spring Boot</div>

</body>
</html>
