<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime OTP Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background-image:url('https://wallpapercave.com/wp/wp5128415.jpg');

            background-size:cover;
            background-position:center;

            overflow:hidden;
        }

        body::before{

            content:'';

            position:absolute;

            width:100%;
            height:100%;

            background:rgba(0,0,0,0.55);
            backdrop-filter:blur(4px);
        }

        .container{

            position:relative;

            width:400px;

            padding:45px;

            border-radius:20px;

            background:rgba(255,255,255,0.08);

            border:1px solid rgba(255,255,255,0.2);

            backdrop-filter:blur(15px);

            box-shadow:0 0 30px rgba(0,0,0,0.6);

            text-align:center;

            color:white;

            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .logo{

            font-size:38px;
            margin-bottom:10px;
        }

        h1{

            margin-bottom:8px;
            color:#ff66c4;
            font-size:32px;
        }

        .subtitle{

            margin-bottom:30px;
            color:#ddd;
            font-size:14px;
        }

        .input-box{

            margin-bottom:20px;
        }

        input{

            width:100%;

            padding:14px;

            border:none;

            border-radius:12px;

            outline:none;

            background:rgba(255,255,255,0.15);

            color:white;

            font-size:15px;
        }

        input::placeholder{
            color:#ddd;
        }

        button{

            width:100%;

            padding:14px;

            border:none;

            border-radius:12px;

            background:linear-gradient(45deg,#ff4da6,#7f5cff);

            color:white;

            font-size:16px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            transform:scale(1.03);

            box-shadow:0 0 15px #ff4da6;
        }

        .footer{

            margin-top:20px;

            font-size:13px;

            color:#ccc;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            🌸
        </div>

        <h1>AnimeVerse</h1>

        <p class="subtitle">
            Login using OTP to enter the Anime World
        </p>

        <form action="/sendOtp" method="post">

            <div class="input-box">

                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

            </div>

            <button type="submit">
                Send OTP
            </button>

        </form>

        <p class="footer">
            Powered by Spring Boot • Docker • Jenkins CI/CD
        </p>

    </div>

</body>

</html>
