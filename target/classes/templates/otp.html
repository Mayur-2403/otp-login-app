<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:#0f172a;
        }

        .container{

            width:400px;

            padding:45px;

            border-radius:20px;

            background:rgba(255,255,255,0.08);

            border:1px solid rgba(255,255,255,0.2);

            backdrop-filter:blur(15px);

            box-shadow:0 0 30px rgba(0,0,0,0.6);

            text-align:center;

            color:white;
        }

        h1{

            margin-bottom:25px;

            color:#ff66c4;
        }

        input{

            width:100%;

            padding:14px;

            margin-bottom:20px;

            border:none;

            border-radius:12px;

            outline:none;

            background:rgba(255,255,255,0.15);

            color:white;

            font-size:15px;
        }

        button{

            width:100%;

            padding:14px;

            border:none;

            border-radius:12px;

            background:linear-gradient(45deg,#ff4da6,#7f5cff);

            color:white;

            font-size:16px;

            font-weight:bold;

            cursor:pointer;
        }

        button:hover{

            transform:scale(1.03);

            box-shadow:0 0 15px #ff4da6;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Verify OTP</h1>

        <form action="/verifyOtp" method="post">

            <input type="text"
                   name="otp"
                   placeholder="Enter OTP"
                   required>

            <button type="submit">
                Verify OTP
            </button>

        </form>

    </div>

</body>

</html>
